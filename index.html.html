<!-- sha256 helper (standalone, no dependencies) -->
<script>
window.sha256 = async function(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
};
</script>

function dbKey(key) {
  return "kv/" + key.replace(/[.#$[\]]/g, "_").substring(0, 200);
}

async function load(key) {
  const snap = await db.ref(dbKey(key)).get();
  return snap.exists() ? { value: snap.val() } : null;
}

async function save(key, value) {
  try {
    const ref = db.ref(dbKey(key));
    if (value === null) {
      await ref.remove();
    } else {
      const v = typeof value === "string" ? value : JSON.stringify(value);
      await ref.set(v);
    }
  } catch(e) {
    console.warn("save error", key, e);
  }
}

// ── message helpers ───────────────────────────────────────────────────────────
const msgKey  = r => "msgs_"+safe(r);
const partKey = r => "part_"+safe(r);
async function getMsgs(roomId){return(await load(msgKey(roomId)))?JSON.parse((await load(msgKey(roomId))).value):[];}
async function saveMsgs(roomId,arr){if(arr.length>150)arr=arr.slice(-150);await save(msgKey(roomId),JSON.stringify(arr));}
async function appendMsg(roomId,msg){
  const arr=await getMsgs(roomId);
  if(!arr.find(m=>m.id===msg.id)){arr.push(msg);await saveMsgs(roomId,arr);}
  const pkR=await load(partKey(roomId));const parts=pkR?JSON.parse(pkR.value):[];
  if(!parts.includes(msg.from)){parts.push(msg.from);await save(partKey(roomId),JSON.stringify(parts));}
}
async function updateMsg(roomId,msgId,patch){
  const arr=await getMsgs(roomId);const i=arr.findIndex(m=>m.id===msgId);
  if(i!==-1){arr[i]={...arr[i],...patch};await saveMsgs(roomId,arr);}
}
async function deleteMsg(roomId,msgId){await saveMsgs(roomId,(await getMsgs(roomId)).filter(m=>m.id!==msgId));}

// ── call helpers ──────────────────────────────────────────────────────────────
const callsKey = loc => "calls_" + safe(loc);
async function loadCalls(loc) {
  const r = await load(callsKey(loc));
  return r ? JSON.parse(r.value) : [];
}
async function saveCalls(loc, arr) {
  await save(callsKey(loc), JSON.stringify(arr));
}
async function startCall(loc, callName, user) {
  const calls = await loadCalls(loc);
  const call = {
    id: "call_" + Date.now(),
    name: callName,
    hostEmail: user.email,
    participants: [{ email: user.email, name: user.name, avatar: user.avatar || null }],
    startedAt: Date.now()
  };
  calls.push(call);
  await saveCalls(loc, calls);
  return call;
}
async function joinCall(loc, callId, user) {
  const calls = await loadCalls(loc);
  const idx = calls.findIndex(c => c.id === callId);
  if (idx === -1) return null;
  if (!calls[idx].participants.find(p => p.email === user.email)) {
    calls[idx].participants.push({ email: user.email, name: user.name, avatar: user.avatar || null });
    await saveCalls(loc, calls);
  }
  return calls[idx];
}
async function leaveCall(loc, callId, userEmail) {
  const calls = await loadCalls(loc);
  const idx = calls.findIndex(c => c.id === callId);
  if (idx === -1) return;
  calls[idx].participants = calls[idx].participants.filter(p => p.email !== userEmail);
  if (calls[idx].participants.length === 0) {
    calls.splice(idx, 1);
  }
  await saveCalls(loc, calls);
}

  const key="notifs_"+safe(toEmail);
  const r=await load(key);const arr=r?JSON.parse(r.value):[];
  arr.unshift({id:Date.now()+"_"+Math.random().toString(36).slice(2,5),text,ts:Date.now(),read:false,...extra});
  if(arr.length>60)arr.splice(60);
  await save(key,JSON.stringify(arr));
}
async function loadNotifs(email){const r=await load("notifs_"+safe(email));return r?JSON.parse(r.value):[];}
async function markAllRead(email){
  const arr=await loadNotifs(email);

}
async function getGuidesAtCampus(loc){
  const r=await load("all_emails");const emails=r?JSON.parse(r.value):[];
  const guides=[];
  for(const e of emails){const ur=await load("u_"+safe(e));if(ur){const ud=JSON.parse(ur.value);if(ud&&ud.location===loc&&ud.role==="guide")guides.push(ud);}}
  return guides;
}
async function getParentsOfStudent(studentEmail,loc){
  const r=await load("all_emails");const emails=r?JSON.parse(r.value):[];
  const parents=[];
  for(const e of emails){const ur=await load("u_"+safe(e));if(ur){const ud=JSON.parse(ur.value);if(ud&&ud.location===loc&&ud.role==="parent"&&(ud.children||[]).includes(studentEmail))parents.push(ud);}}
  return parents;
}

function getMondayKey(){const d=new Date();const day=d.getDay();const diff=d.getDate()-(day===0?6:day-1);const mon=new Date(d.setDate(diff));return mon.toISOString().slice(0,10);}
async function getKairos(email){
  const r=await load("kairos_"+safe(email));
  if(!r)return{points:KAIROS_DEFAULT,weekKey:getMondayKey()};

  if(data.weekKey!==thisWeek){const reset={points:KAIROS_DEFAULT,weekKey:thisWeek};await save("kairos_"+safe(email),JSON.stringify(reset));return reset;}
  return data;
}

function KairosPanel({user,allStudents,onClose,onAdjust}){
  const[pointsMap,setPointsMap]=useState({});

  const[adjusting,setAdjusting]=useState(null);
  const isGuide=user.role==="guide";
  const isParent=user.role==="parent";
  const isStudent=user.role==="student";

  // Build the list of students this viewer can see
  const visibleStudents=React.useMemo(()=>{
    if(isGuide||isStudent){
      // Include self if viewer is a student
      const list=[...allStudents];
      if(isStudent&&!list.find(s=>s.email===user.email))list.unshift(user);
      return list;
    }
    if(isParent)return allStudents.filter(s=>(user.children||[]).includes(s.email));
    return[];
  },[allStudents,user,isGuide,isParent,isStudent]);

  useEffect(()=>{
    (async()=>{
      const map={};
      await Promise.all(visibleStudents.map(async s=>{const k=await getKairos(s.email);map[s.email]=k.points;}));
      setPointsMap(map);setLoading(false);
    })();
  },[visibleStudents.map(s=>s.email).join(",")]);

  async function adjust(email,delta){
    if(adjusting)return;
    const cur=pointsMap[email]??KAIROS_DEFAULT;
    const nv=Math.min(KAIROS_MAX,Math.max(0,cur+delta));
    if(nv===cur)return;
    setAdjusting(email);
    await onAdjust(email,nv);
    setPointsMap(prev=>({...prev,[email]:nv}));
    setAdjusting(null);
  }

  const barColor=p=>p>=KAIROS_GAME_MIN?"#4ade80":p>=3?"#e8b84b":"#fc8181";

            <div>
              <div style={{fontSize:17,fontWeight:800,color:"#1a1a2e"}}>Kairos Points</div>
              <div style={{fontSize:11,color:"#aaa"}}>Resets to {KAIROS_DEFAULT} every Monday · Max {KAIROS_MAX}</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#aaa",lineHeight:1}}>×</button>

        {loading&&<div style={{textAlign:"center",padding:"30px 0",color:"#bbb",fontSize:14}}>Loading...</div>}
        {!loading&&visibleStudents.length===0&&<div style={{textAlign:"center",padding:"30px 0",color:"#bbb",fontSize:13,fontStyle:"italic"}}>{isParent?"No children linked to your account yet.":"No students at your campus yet."}</div>}
        {!loading&&visibleStudents.map(s=>{
          const pts=pointsMap[s.email]??KAIROS_DEFAULT;
          const hasGame=pts>=KAIROS_GAME_MIN;
          const isMe=s.email===user.email;
          return<div key={s.email} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 12px",borderRadius:12,marginBottom:6,background:isMe?"#f8f9ff":"#fafafa",border:`1px solid ${isMe?"#c3d2f0":"#f0f0f0"}`}}>
            <AvatarDisplay name={s.name} email={s.email} avatar={s.avatar} size={36}/>

function BrainrotModal({onClose,bannedWords,onBan,onUnban}){
  const[input,setInput]=useState("");
  const[err,setErr]=useState("");
  function handleBan(){
    const w=input.trim();
    if(!w){setErr("Please enter a word.");return;}
    if(bannedWords.map(x=>x.toLowerCase()).includes(w.toLowerCase())){setErr("That word is already banned.");return;}
    onBan(w);setInput("");setErr("");
  }
  return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}} onClick={onClose}>
    <div style={{background:"#fff",borderRadius:22,padding:"30px 28px",width:"100%",maxWidth:460,boxShadow:"0 24px 60px rgba(0,0,0,0.35)"}} onClick={e=>e.stopPropagation()}>

        <h3 style={{margin:0,fontSize:20,fontWeight:800,color:"#1a1a2e"}}>Brainrot Word Manager</h3>
      </div>
      <p style={{margin:"0 0 18px",fontSize:14,color:"#888",lineHeight:1.5}}>What brainrot word would you like to ban?</p>
      <div style={{display:"flex",gap:8,marginBottom:err?6:14}}>
        <input value={input} onChange={e=>{setInput(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&handleBan()} placeholder="Type a brainrot word..." style={{flex:1,padding:"10px 14px",border:"2px solid #e8e8e8",borderRadius:10,fontSize:14,outline:"none",background:"#fafafa"}}/>
        <button onClick={handleBan} style={{padding:"10px 18px",background:"linear-gradient(135deg,#1a1a2e,#302b63)",color:"#e8b84b",border:"none",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>👩🏻‍⚖️ Ban</button>

      <div style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:0.8,marginBottom:8}}>Currently Banned Words ({bannedWords.length})</div>

          {w}
          <button onClick={()=>onUnban(w)} title="Unban" style={{background:"none",border:"none",cursor:"pointer",color:"#fc8181",fontSize:14,lineHeight:1,padding:"0 0 0 2px",fontWeight:700}} onMouseEnter={e=>e.currentTarget.style.color="#e53e3e"} onMouseLeave={e=>e.currentTarget.style.color="#fc8181"}>×</button>

      </div>

    {p:/\blet the cat out of the bag\b/i,term:"let the cat out of the bag",lit:"accidentally revealed a secret"},
    {p:/\bmiss the boat\b/i,term:"miss the boat",lit:"miss an opportunity"},
    {p:/\bjump on the bandwagon\b/i,term:"jump on the bandwagon",lit:"follow a popular trend"},
    {p:/\bwrap your head around\b/i,term:"wrap your head around",lit:"understand or comprehend something"},
    {p:/\bthe ball is in your court\b/i,term:"the ball is in your court",lit:"it's your turn to decide or act"},
    {p:/\bno pain no gain\b/i,term:"no pain no gain",lit:"hard work is required to achieve results"},
    {p:/\bwhy did the\b/i,term:"why did the...",lit:"the setup of a joke"},
    {p:/\bknock.?knock\b/i,term:"knock knock",lit:"the start of a knock-knock joke"},
    {p:/\bjust kidding\b/i,term:"just kidding",lit:"I was not being serious"},
    {p:/\bi was kidding\b/i,term:"I was kidding",lit:"I was not being serious"},
    {p:/\bjk\b/i,term:"jk (just kidding)",lit:"I was not being serious"},
    {p:/\bget it\?/i,term:"get it?",lit:"asking if you understood the joke"},
    {p:/\bdo you get (it|the joke)\b/i,term:"do you get it?",lit:"asking if you understood the joke"},
  ];
  for(const c of checks){if(c.p.test(text))return{term:c.term,lit:c.lit};}
  const emojiMap=[
    {e:"\u{1F602}",lit:"laughing very hard"},
    {e:"\u{1F923}",lit:"rolling on the floor laughing"},
    {e:"\u{1F60F}",lit:"being smug or sarcastic"},
    {e:"\u{1F644}",lit:"rolling eyes — showing annoyance or disbelief"},
    {e:"\u{1F605}",lit:"nervous laughing or feeling relieved"},
    {e:"\u{1F480}",lit:"dying of laughter (extremely funny)"},
    {e:"\u{1F606}",lit:"laughing"},
    {e:"\u{1F61C}",lit:"being playful or silly"},
    {e:"\u{1F92D}",lit:"trying not to laugh"},
    {e:"\u{1F639}",lit:"laughing very hard"},
    {e:"\u{1F92A}",lit:"being goofy or silly"},
  ];
  if(text.trim().length<100){for(const h of emojiMap){if(text.includes(h.e))return{term:h.e,lit:h.lit};}}
  return null;
}
function msgSimilarity(a,b){
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim().replace(/\s+/g,' ');
  const na=norm(a),nb=norm(b);
  if(!na||!nb)return 0;
  if(na===nb)return 1;
  const wa=new Set(na.split(' ').filter(w=>w.length>2));
  const wb=new Set(nb.split(' ').filter(w=>w.length>2));
  if(wa.size===0&&wb.size===0)return na===nb?1:0;
  const inter=[...wa].filter(w=>wb.has(w)).length;
  const union=new Set([...wa,...wb]).size;
  return union===0?0:inter/union;
}

          {studentsInGrade.map(student=>{
            const checks=checksMap[student.email]||{};

            const studentSubGrade=null;
            const tasks=isSplit?[]:(CC_TASKS[activeGrade]||[]);

            const pfxA=is45?"g4_":is23?"g2_":"gk_";const pfxB=is45?"g5_":is23?"g3_":"g1_";const done45=(isSplit)?(tasks4.filter(t=>checks[pfxA+t.id]).length+tasks5.filter(t=>checks[pfxB+t.id]).length):0;

                    {checked&&<svg width="9" height="9" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  </div>
                  {task.name}

                  </div>

                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                  <div style={{width:72,background:"rgba(255,255,255,0.15)",borderRadius:20,height:5,overflow:"hidden"}}>

                {renderTaskChips(tasks4,pfxA)}
                <div style={{padding:"8px 14px 4px",background:"#f0fff4",borderBottom:"1px solid #d4edda"}}><span style={{fontSize:11,fontWeight:700,color:"#276749",textTransform:"uppercase",letterSpacing:0.8}}>{is45?"5th":is23?"3rd":"1st Grade"} Tasks</span></div>
                {renderTaskChips(tasks5,pfxB)}

                <div style={{padding:"8px 14px 4px",background:"#f0f4ff",borderBottom:"1px solid #e8e8ff"}}><span style={{fontSize:11,fontWeight:700,color:"#4a6ec5",textTransform:"uppercase",letterSpacing:0.8}}>{is45?"4th":is23?"2nd":"Kindergarten"} Tasks</span></div>{renderTaskChips(tasks4,pfxA)}

              </>:renderTaskChips(tasks,"")}
            </div>;
          })}

      </div>

      {!isGuide&&<div style={{padding:"10px 24px 16px",flexShrink:0,borderTop:"1px solid #f0f0f0"}}>
        <div style={{fontSize:12,color:"#bbb",textAlign:"center"}}>Only guides can check off tasks. Contact your guide if a task needs to be updated.</div>
      </div>}
    </div>
  </div>;

// ── Voice Visualizer (real mic audio via Web Audio API) ───────────────────────
function VoiceVisualizer({stream,bars=14,width=80,height=32,color="#4ade80",idle=false}){
  const canvasRef=useRef();
  const rafRef=useRef();
  const ctxRef=useRef();
  const analyserRef=useRef();

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas)return;
    if(!stream||idle){
      // draw flat idle bars
      cancelAnimationFrame(rafRef.current);
      const c=canvas.getContext("2d");
      c.clearRect(0,0,canvas.width,canvas.height);
      const bw=canvas.width/bars;
      for(let i=0;i<bars;i++){
        const h=3;
        c.fillStyle=color;c.globalAlpha=0.22;
        c.fillRect(i*bw+1,canvas.height/2-h/2,bw-2,h);
      }
      return;
    }
    let audioCtx;
    try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    const source=audioCtx.createMediaStreamSource(stream);
    const analyser=audioCtx.createAnalyser();
    analyser.fftSize=128;
    source.connect(analyser);
    analyserRef.current=analyser;
    ctxRef.current=audioCtx;
    const data=new Uint8Array(analyser.frequencyBinCount);
    const draw=()=>{
      rafRef.current=requestAnimationFrame(draw);
      const c=canvas.getContext("2d");
      analyser.getByteFrequencyData(data);
      c.clearRect(0,0,canvas.width,canvas.height);
      const bw=canvas.width/bars;
      for(let i=0;i<bars;i++){
        const v=data[Math.floor(i*(data.length*0.7)/bars)]/255;
        const barH=Math.max(3,v*canvas.height*0.92);
        const y=canvas.height/2-barH/2;
        c.fillStyle=color;
        c.globalAlpha=0.28+v*0.72;
        c.fillRect(i*bw+1,y,bw-2,barH);
      }
    };
    draw();
    return()=>{
      cancelAnimationFrame(rafRef.current);
      try{audioCtx.close();}catch(e){}
    };
  },[stream,idle,bars,color,width,height]);

  return<canvas ref={canvasRef} width={width} height={height} style={{display:"block",borderRadius:4}}/>;
}

// Polls amplitude written by remote user, animates bars accordingly
function RemoteVoiceVisualizer({email,bars=14,width=80,height=32,color="#4ade80"}){
  const[amplitude,setAmplitude]=useState(0);
  const canvasRef=useRef();
  const rafRef=useRef();
  const phasesRef=useRef(Array.from({length:bars},(_,i)=>i*(Math.PI*2/bars)));
  const ampRef=useRef(0);

  useEffect(()=>{
    const t=setInterval(async()=>{
      try{
        const r=await load("speaking_"+safe(email));
        if(r){
          const d=JSON.parse(r.value);
          // fade out if stale (>800ms old)
          const fresh=Date.now()-d.ts<800;
          ampRef.current=fresh?(d.amplitude||0):0;
        }else{ampRef.current=0;}
      }catch(e){ampRef.current=0;}
    },200);
    return()=>clearInterval(t);
  },[email]);

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas)return;
    const draw=()=>{
      rafRef.current=requestAnimationFrame(draw);
      const c=canvas.getContext("2d");
      const amp=ampRef.current;
      c.clearRect(0,0,canvas.width,canvas.height);
      const bw=canvas.width/bars;
      phasesRef.current=phasesRef.current.map((p,i)=>p+0.06+i*0.003);
      for(let i=0;i<bars;i++){
        const wave=(Math.sin(phasesRef.current[i])*0.5+0.5);
        const v=amp*wave;
        const barH=Math.max(3,v*canvas.height*0.92);
        const y=canvas.height/2-barH/2;
        c.fillStyle=color;
        c.globalAlpha=0.28+v*0.72;
        c.fillRect(i*bw+1,y,bw-2,barH);
      }
    };
    draw();
    return()=>cancelAnimationFrame(rafRef.current);
  },[bars,color]);

  return<canvas ref={canvasRef} width={width} height={height} style={{display:"block",borderRadius:4}}/>;
}

  return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}} onClick={onClose}><div style={{background:"#fff",borderRadius:18,padding:"30px 28px",width:"100%",maxWidth:420,boxShadow:"0 24px 60px rgba(0,0,0,0.35)"}} onClick={e=>e.stopPropagation()}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}><h3 style={{margin:0,fontSize:18,fontWeight:800,color:"#1a1a2e"}}>Report Message</h3><button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#aaa",lineHeight:1}}>x</button></div>{done?<div style={{textAlign:"center",padding:"10px 0 6px"}}><div style={{fontSize:40,marginBottom:12}}>✅</div><p style={{fontSize:14,color:"#444",marginBottom:20,lineHeight:1.5}}>Report submitted. Guides have been notified.</p><button onClick={onClose} style={{padding:"11px 32px",background:"linear-gradient(135deg,#1a1a2e,#302b63)",color:"#fff",border:"none",borderRadius:12,fontSize:14,fontWeight:700,cursor:"pointer"}}>Close</button></div>:!reason?<><p style={{margin:"0 0 16px",fontSize:13,color:"#888",lineHeight:1.5}}>Why does this message go against Alpha School?</p><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>{REPORT_REASONS.map(r=><button key={r.id} onClick={()=>setReason(r)} style={{padding:"14px 10px",border:"2px solid #e8e8e8",borderRadius:14,cursor:"pointer",background:"#fafafa",fontSize:13,fontWeight:600,color:"#1a1a2e",textAlign:"left"}} onMouseEnter={ev=>{ev.currentTarget.style.borderColor="#e8b84b";ev.currentTarget.style.background="#fffdf5";}} onMouseLeave={ev=>{ev.currentTarget.style.borderColor="#e8e8e8";ev.currentTarget.style.background="#fafafa";}}>{r.label}</button>)}</div></>:<><div style={{marginBottom:16,display:"flex",alignItems:"center",gap:10}}><div style={{padding:"6px 12px",background:"#f0f4ff",border:"1px solid #c3d2f0",borderRadius:8,fontSize:13,fontWeight:600,color:"#4a6ec5"}}>{reason.label}</div><button onClick={()=>setReason(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:"#aaa",textDecoration:"underline"}}>Change</button></div><label style={{display:"block",fontSize:11,fontWeight:700,color:"#555",marginBottom:6,textTransform:"uppercase",letterSpacing:0.8}}>Your Summary</label><textarea value={summary} onChange={e=>setSummary(e.target.value)} placeholder="Describe what happened..." style={{width:"100%",minHeight:110,padding:"11px 14px",border:"2px solid #e8e8e8",borderRadius:10,fontSize:13,outline:"none",boxSizing:"border-box",resize:"vertical",fontFamily:"inherit",lineHeight:1.5,color:"#1a1a2e",background:"#fafafa"}} onFocus={e=>e.currentTarget.style.borderColor="#e8b84b"} onBlur={e=>e.currentTarget.style.borderColor="#e8e8e8"}/><div style={{display:"flex",gap:10,marginTop:14}}><button onClick={onClose} style={{flex:1,padding:"11px",background:"#f5f5f5",border:"none",borderRadius:10,fontSize:14,fontWeight:600,cursor:"pointer",color:"#555"}}>Cancel</button><button onClick={handle} disabled={loading||!summary.trim()} style={{flex:2,padding:"11px",background:"linear-gradient(135deg,#c53030,#9b2c2c)",color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",opacity:loading||!summary.trim()?0.5:1}}>{loading?"Submitting...":"Submit Report"}</button></div></>}</div></div>;
}

  return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:"16px 10px"}} onClick={onClose}>
    <div style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:"min(980px,calc(100vw - 20px))",maxHeight:"calc(100vh - 32px)",display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,0.35)"}} onClick={e=>e.stopPropagation()}>
      <div style={{padding:"18px 24px 14px",borderBottom:"1px solid #f0f0f0",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:17,fontWeight:800,color:"#1a1a2e",fontFamily:"'Neuropolitical',sans-serif"}}>Settings</span>
        <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#aaa",lineHeight:1,padding:0}}>×</button>
      </div>
      <div style={{overflowY:"auto",flex:1,padding:"20px 24px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:28,alignItems:"start"}}>
          <div>
            <div style={{marginBottom:14,padding:"5px 10px",background:"#f5f5f5",borderRadius:8,fontSize:12,color:"#555",display:"inline-flex",alignItems:"center",gap:6}}><span>{user.role==="guide"?"📚":user.role==="parent"?"👪":"🎒"}</span><span style={{fontWeight:600,textTransform:"capitalize"}}>{user.role}</span><span style={{fontSize:10,color:"#ccc"}}>cannot be changed</span></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}><div><label style={lbl}>Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" style={inp} onFocus={e=>e.currentTarget.style.borderColor="#e8b84b"} onBlur={e=>e.currentTarget.style.borderColor="#e8e8e8"}/></div><div><label style={lbl}>Campus</label><select value={location} onChange={e=>setLocation(e.target.value)} style={{...inp,color:location?"#1a1a2e":"#999"}}><option value="">Campus...</option>{LOCS.map(l=><option key={l} value={l}>{l}</option>)}</select></div></div>
            {user.role==="student"&&<div style={{marginBottom:12}}><label style={lbl}>Grade Level</label><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{GRADE_LEVELS.map(g=><button key={g.id} onClick={()=>setGrade(g.id)} style={{padding:"4px 8px",border:`2px solid ${grade===g.id?"#e8b84b":"#e8e8e8"}`,borderRadius:20,cursor:"pointer",fontSize:10,fontWeight:600,background:grade===g.id?"#fffdf5":"#fafafa",color:"#1a1a2e",whiteSpace:"nowrap",flexShrink:0,lineHeight:1}}>{g.icon} {g.label}</button>)}</div></div>}
            <div style={{marginBottom:12}}><label style={lbl}>Profile Picture</label>{shadowMode?<div style={{display:"flex",gap:6,alignItems:"center",marginTop:4,flexWrap:"wrap"}}><span style={{fontSize:11,color:"#888"}}>Shadow avatar:</span>{SHADOW_MOONS.map(m=><button key={m} onClick={()=>setShadowAvatar(m)} style={{width:30,height:30,borderRadius:"50%",border:`2px solid ${shadowAvatar===m?"#7c3aed":"#e8e8e8"}`,cursor:"pointer",background:shadowAvatar===m?"#f5f0ff":"#fafafa",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{m}</button>)}</div>:<div style={{display:"flex",flexWrap:"wrap",gap:4,maxHeight:100,overflowY:"auto"}}><button onClick={()=>setAvatar("letter")} style={{width:30,height:30,borderRadius:"50%",border:`2px solid ${avatar==="letter"?"#e8b84b":"#e8e8e8"}`,cursor:"pointer",background:bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#fff",flexShrink:0}}>{letter}</button>{FACE_EMOJIS.map(e=><button key={e} onClick={()=>setAvatar(e)} style={{width:30,height:30,borderRadius:"50%",border:`2px solid ${avatar===e?"#e8b84b":"#e8e8e8"}`,cursor:"pointer",background:avatar===e?"#fffdf5":"#fafafa",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{e}</button>)}</div>}</div>

function OwnerCaptchaScreen({pendingUser,onSuccess,onBack}){
  const[denied,setDenied]=useState(false);
  const[saveVisible,setSaveVisible]=useState(true);
  const[showAutism,setShowAutism]=useState(false);
  const[birdActive,setBirdActive]=useState(false);
  const[dragging,setDragging]=useState(false);
  const[birdPos,setBirdPos]=useState({x:0,y:0});
  const[dragOff,setDragOff]=useState({x:0,y:0});
  const[overNo,setOverNo]=useState(false);
  const noBtnRef=useRef();

  function onBirdMouseDown(e){
    if(!birdActive)return;
    e.preventDefault();
    const rect=e.currentTarget.getBoundingClientRect();
    setDragOff({x:e.clientX-rect.left,y:e.clientY-rect.top});
    setBirdPos({x:rect.left,y:rect.top});
    setDragging(true);
  }
  function onMouseMove(e){
    if(!dragging)return;
    const nx=e.clientX-dragOff.x,ny=e.clientY-dragOff.y;
    setBirdPos({x:nx,y:ny});
    if(noBtnRef.current){
      const r=noBtnRef.current.getBoundingClientRect();
      setOverNo(nx+25>=r.left&&nx+25<=r.right&&ny+25>=r.top&&ny+25<=r.bottom);
    }
  }
  function onMouseUp(){
    if(!dragging)return;
    if(overNo){onSuccess();}
    setDragging(false);setOverNo(false);
  }

  return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#f8f9ff 0%,#f0f4ff 100%)",userSelect:"none"}} onMouseMove={onMouseMove} onMouseUp={onMouseUp}>
    <div style={{width:"100%",maxWidth:420,padding:"0 20px",display:"flex",flexDirection:"column",gap:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:28}}>
        <div
          onMouseDown={onBirdMouseDown}
          style={{width:44,height:44,borderRadius:12,background:"linear-gradient(135deg,#1a1a2e,#16213e)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,boxShadow:"0 4px 15px rgba(232,184,75,0.25)",flexShrink:0,cursor:birdActive?"grab":"default",transition:"border 0.2s"}}
          title={birdActive?"Click and drag to the No button":undefined}
        >🐦</div>
        <div>
          <div style={{fontSize:22,fontWeight:800,color:"#1a1a2e",letterSpacing:1,fontFamily:"'Neuropolitical',sans-serif"}}>ALPHA</div>
          <div style={{fontSize:10,color:"#999",letterSpacing:3,fontWeight:600,textTransform:"uppercase"}}>School Connect</div>
        </div>
      </div>

      <div style={{background:"#fff",borderRadius:20,padding:"32px 28px",boxShadow:"0 8px 32px rgba(0,0,0,0.08)",border:"1px solid #f0f0f0"}}>
        <div style={{fontSize:36,textAlign:"center",marginBottom:16}}>🔐</div>
        <h2 style={{fontSize:18,fontWeight:800,color:"#1a1a2e",textAlign:"center",margin:"0 0 8px"}}>Owner Verification</h2>
        <p style={{fontSize:13,color:"#888",textAlign:"center",margin:"0 0 28px",lineHeight:1.6}}>Are you actually the owner of the website?</p>

        {denied&&<div style={{background:"#fff5f5",border:"1px solid #fed7d7",borderRadius:10,padding:"10px 16px",fontSize:13,color:"#c53030",fontWeight:600,textAlign:"center",marginBottom:16}}>⛔ Access denied. Nice try.</div>}

        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>{setDenied(true);setTimeout(onBack,2000);}} style={{flex:1,padding:"12px",background:"linear-gradient(135deg,#1a1a2e,#302b63)",color:"#fff",border:"none",borderRadius:12,fontSize:14,fontWeight:700,cursor:"pointer"}}>Yes</button>
          <button ref={noBtnRef} onClick={()=>{setDenied(true);setTimeout(onBack,2000);}}
            style={{flex:1,padding:"12px",background:overNo?"#dcfce7":"#f5f5f5",border:`2px solid ${overNo?"#4ade80":"#e8e8e8"}`,borderRadius:12,fontSize:14,fontWeight:700,cursor:"pointer",color:"#555",transition:"all 0.15s"}}>No</button>
        </div>

      </div>
    </div>

    {/* 💾 Button bottom-left */}
    {saveVisible&&<button onClick={()=>setShowAutism(true)}
      style={{position:"fixed",bottom:24,left:24,background:"none",border:"none",cursor:"pointer",fontSize:22,opacity:0.08,zIndex:100,padding:4}}>💾</button>}

    {/* Autism popup */}
    {showAutism&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}}>
      <div style={{background:"#fff",borderRadius:18,padding:"32px 28px",width:"100%",maxWidth:360,boxShadow:"0 20px 60px rgba(0,0,0,0.3)",textAlign:"center"}}>
        <div style={{fontSize:36,marginBottom:14}}>🧩</div>
        <h3 style={{fontSize:17,fontWeight:800,color:"#1a1a2e",margin:"0 0 10px"}}>Do you have Autism?</h3>
        <div style={{display:"flex",gap:10,marginTop:20}}>
          <button onClick={()=>{setShowAutism(false);setSaveVisible(false);setBirdActive(true);setDenied(false);}}
            style={{flex:1,padding:"11px",background:"linear-gradient(135deg,#0ea5e9,#0369a1)",color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer"}}>Yes</button>
          <button onClick={()=>setShowAutism(false)}
            style={{flex:1,padding:"11px",background:"#f5f5f5",border:"2px solid #e8e8e8",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer",color:"#555"}}>No</button>
        </div>
      </div>
    </div>}

    {/* Floating dragged bird */}
    {dragging&&<div style={{position:"fixed",left:birdPos.x,top:birdPos.y,width:50,height:50,borderRadius:12,background:"linear-gradient(135deg,#1a1a2e,#16213e)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,boxShadow:"0 8px 24px rgba(232,184,75,0.5)",border:"2px solid #e8b84b",pointerEvents:"none",zIndex:999,cursor:"grabbing"}}>🐦</div>}
  </div>;
}

  async function handleFpNext(){setFpErr("");if(!fpEmail.trim()){setFpErr("Please enter your email.");return;}setFpLoading(true);const exists=await load("auth_"+safe(fpEmail.trim().toLowerCase()));setFpLoading(false);if(!exists){setFpErr("No account found with that email.");return;}setFpStep("verify");}
  async function handleFpVerify(){setFpErr("");if(fpCode.trim().length!==6){setFpErr("Please enter your 6-character verification code.");return;}setFpLoading(true);const vc=await getVC(fpEmail.trim().toLowerCase());setFpLoading(false);if(fpCode.trim().toUpperCase()!==vc){setFpErr("Incorrect code. Ask the site owner for your verification code.");return;}setFpStep("newpass");}
  async function handleChangePassword(){setFpErr("");if(!fpPass.trim()){setFpErr("Please enter a new password.");return;}if(fpPass!==fpPass2){setFpErr("Passwords do not match.");return;}if(fpPass.length<6){setFpErr("Password must be at least 6 characters.");return;}setFpLoading(true);await onForgotPassword(fpEmail.trim().toLowerCase(),fpPass);setFpLoading(false);setFpDone(true);}
  function resetFp(){setFpStep(null);setFpEmail("");setFpCode("");setFpPass("");setFpPass2("");setFpErr("");setFpDone(false);}
  async function handleSocialProceed(){
    setSocialErr("");
    if(!socialEmail.trim()||!socialEmail.includes("@")){setSocialErr("Please enter a valid email address.");return;}
    setSocialLoading(true);
    const ascEmail=localStorage.getItem("asc_link_rev_"+socialProv+"_"+socialEmail.trim());
    if(!ascEmail){setSocialErr("No ASC account is linked to this email. Connect it first in Settings.");setSocialLoading(false);return;}
    const udR=await load("u_"+safe(ascEmail));
    if(!udR){setSocialErr("Account not found.");setSocialLoading(false);return;}
    const ud=JSON.parse(udR.value);
    if(await getLocked(ascEmail)){setSocialErr("This account is locked.");setSocialLoading(false);return;}
    setSocialLoading(false);onSocialLogin(ud);
  }

  if(fpStep==="email"){return<AuthWrap><Logo/><h2 style={{fontSize:22,fontWeight:800,color:"#1a1a2e",margin:"22px 0 4px"}}>Forgot Password</h2><p style={{fontSize:13,color:"#888",marginBottom:24}}>Enter your school email and we'll let you set a new password.</p><Field label="School Email" value={fpEmail} onChange={setFpEmail} placeholder="you@alpha.edu"/><ErrBox msg={fpErr}/><PrimaryBtn onClick={handleFpNext} loading={fpLoading}>Continue</PrimaryBtn><div style={{textAlign:"center",fontSize:13,color:"#888"}}><span onClick={resetFp} style={{color:"#e8b84b",fontWeight:700,cursor:"pointer"}}>← Back to Sign In</span></div></AuthWrap>;}
  if(fpStep==="verify"){return<AuthWrap><Logo/><h2 style={{fontSize:22,fontWeight:800,color:"#1a1a2e",margin:"22px 0 4px"}}>Verify Your Identity</h2><p style={{fontSize:13,color:"#888",marginBottom:24}}>Enter the 6-character code for <strong>{fpEmail}</strong>. Contact the site owner if you need your code.</p><Field label="Verification Code" value={fpCode} onChange={v=>setFpCode(v.toUpperCase())} placeholder="e.g. A3BX7K" autoFocus/><ErrBox msg={fpErr}/><PrimaryBtn onClick={handleFpVerify} loading={fpLoading}>Verify Code</PrimaryBtn><div style={{textAlign:"center",fontSize:13,color:"#888"}}><span onClick={resetFp} style={{color:"#e8b84b",fontWeight:700,cursor:"pointer"}}>← Back to Sign In</span></div></AuthWrap>;}
  if(fpStep==="newpass"){return<AuthWrap><Logo/><h2 style={{fontSize:22,fontWeight:800,color:"#1a1a2e",margin:"22px 0 4px"}}>{fpDone?"Password Changed!":"Set New Password"}</h2>{fpDone?<><p style={{fontSize:13,color:"#4ade80",marginBottom:24,fontWeight:600}}>✅ Your password has been updated. You can now sign in with your new password.</p><PrimaryBtn onClick={resetFp}>Back to Sign In</PrimaryBtn></>:<><p style={{fontSize:13,color:"#888",marginBottom:24}}>Create a new password for <strong>{fpEmail}</strong>.</p><Field label="New Password" type="password" value={fpPass} onChange={setFpPass} placeholder="New password"/><Field label="Confirm New Password" type="password" value={fpPass2} onChange={setFpPass2} placeholder="Repeat new password"/><ErrBox msg={fpErr}/><PrimaryBtn onClick={handleChangePassword} loading={fpLoading}>Change Password</PrimaryBtn><div style={{textAlign:"center",fontSize:13,color:"#888"}}><span onClick={resetFp} style={{color:"#e8b84b",fontWeight:700,cursor:"pointer"}}>← Back to Sign In</span></div></>}</AuthWrap>;}

  // Social sign-in screen
  if(socialProv){
    const prov=PROVS.find(p=>p.pid===socialProv);
    return<AuthWrap>
      <Logo/>
      <div style={{display:"flex",alignItems:"center",gap:12,margin:"16px 0 6px"}}><img src={prov.logo} style={{width:32,height:32,objectFit:"contain"}} alt={prov.label}/><h2 style={{fontSize:22,fontWeight:800,color:"#1a1a2e",margin:0}}>Sign in with {prov.label}</h2></div>
      <p style={{fontSize:13,color:"#888",marginBottom:24}}>Enter the email address you use for your <strong>{prov.label}</strong> account.</p>
      <Field label={prov.label+" Email"} value={socialEmail} onChange={v=>{setSocialEmail(v);setSocialErr("");}} placeholder={"your@email.com"} autoFocus/>
      <ErrBox msg={socialErr}/>
      <PrimaryBtn onClick={handleSocialProceed} loading={socialLoading}>Proceed</PrimaryBtn>
      <div style={{textAlign:"center",fontSize:13,color:"#888"}}><span onClick={()=>{setSocialProv(null);setSocialEmail("");setSocialErr("");}} style={{color:"#e8b84b",fontWeight:700,cursor:"pointer"}}>← Back to Sign In</span></div>
    </AuthWrap>;
  }

  return<AuthWrap>
    <Logo/>
    <h2 style={{fontSize:22,fontWeight:800,color:"#1a1a2e",margin:"22px 0 4px"}}>Welcome back</h2>
    <p style={{fontSize:13,color:"#888",marginBottom:24}}>Sign in to connect with your Alpha community</p>
    <Field label="School Email" value={form.email} onChange={v=>fv("email",v)} placeholder="you@alpha.edu"/>
    <Field label="Password" type="password" value={form.password} onChange={v=>fv("password",v)} placeholder="••••••••"/>
    <div style={{textAlign:"right",marginTop:-8,marginBottom:12}}><span onClick={()=>setFpStep("email")} style={{fontSize:12,color:"#e8b84b",fontWeight:600,cursor:"pointer"}}>Forgot password?</span></div>
    <ErrBox msg={err}/>
    <PrimaryBtn onClick={onLogin} loading={loading}>Sign In</PrimaryBtn>
    <div style={{marginTop:4}}><div style={{textAlign:"center",fontSize:11,color:"#bbb",marginBottom:8,letterSpacing:0.3}}>or sign in with...</div><div style={{display:"flex",gap:8}}>{PROVS.map(p=><button key={p.pid} onClick={()=>{setSocialProv(p.pid);setSocialEmail("");setSocialErr("");}} style={{flex:1,padding:"9px 6px",border:"2px solid #e8e8e8",borderRadius:10,background:"#fff",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:5,fontSize:12,fontWeight:600,color:"#555",transition:"all 0.15s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor=p.color;e.currentTarget.style.color=p.color;e.currentTarget.style.background="#fafafa";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#e8e8e8";e.currentTarget.style.color="#555";e.currentTarget.style.background="#fff";}}><img src={p.logo} style={{width:22,height:22,objectFit:"contain"}} alt={p.label}/>{p.label}</button>)}</div></div>
    <div style={{textAlign:"center",fontSize:13,color:"#888",marginTop:16}}>New to Alpha?{" "}<span onClick={onSignup} style={{color:"#e8b84b",fontWeight:700,cursor:"pointer"}}>Create account</span></div>
  </AuthWrap>;
}

function SignupScreen({form,fv,onSubmit,onBack,err,loading}){return<AuthWrap><Logo/><h2 style={{fontSize:22,fontWeight:800,color:"#1a1a2e",margin:"22px 0 4px"}}>Create your account</h2><p style={{fontSize:13,color:"#888",marginBottom:24}}>Join the Alpha community at your campus</p><Field label="Full Name" value={form.name} onChange={v=>fv("name",v)} placeholder="Your full name"/><Field label="School Email" value={form.email} onChange={v=>fv("email",v)} placeholder="you@alpha.edu"/><Field label="Password" type="password" value={form.password} onChange={v=>fv("password",v)} placeholder="Create a strong password"/><LocSelect value={form.location} onChange={v=>fv("location",v)}/><ErrBox msg={err}/><PrimaryBtn onClick={onSubmit} loading={loading}>Create Account</PrimaryBtn><div style={{textAlign:"center",fontSize:13,color:"#888"}}>Already have an account?{" "}<span onClick={onBack} style={{color:"#e8b84b",fontWeight:700,cursor:"pointer"}}>Sign in</span></div></AuthWrap>;}

function RoleScreen({name,onSelect}){return<div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f0c29,#302b63,#24243e)",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"}}><div style={{background:"#fff",borderRadius:24,padding:"44px 40px",width:"100%",maxWidth:520,boxShadow:"0 30px 80px rgba(0,0,0,0.35)",textAlign:"center"}}><Logo/><h2 style={{fontSize:24,fontWeight:800,color:"#1a1a2e",margin:"24px 0 8px"}}>Hey {name}! Who are you at Alpha?</h2><p style={{fontSize:14,color:"#888",marginBottom:36}}>Choose your role to get started</p><div style={{display:"flex",flexDirection:"column",gap:14}}>{[{role:"guide",icon:"📚",title:"Guide",desc:"I teach and mentor students at Alpha"},{role:"student",icon:"🎒",title:"Student",desc:"I learn and grow at Alpha"},{role:"parent",icon:"👪",title:"Parent",desc:"I support my child's journey at Alpha"}].map(r=><RoleCard key={r.role} {...r} onSelect={onSelect}/>)}</div></div></div>;}

const KNOWN_SITES={

  "claude.ai":"Claude","alphafight.netlify.app":"Alpha Brawl",
  "dont-die-run.base44.app":"VOID: DONT DIE",
};
function getSiteName(url){
  try{
    const host=new URL(url).hostname.replace(/^www\./,"");
    if(KNOWN_SITES[host])return KNOWN_SITES[host];
    for(const[d,n]of Object.entries(KNOWN_SITES)){if(host.endsWith("."+d))return n;}
    const parts=host.split(".");
    const base=parts.length>=2?parts[parts.length-2]:parts[0];
    return base.charAt(0).toUpperCase()+base.slice(1);
  }catch(e){return"Link";}
}
function parseLinks(text){
  const re=/(https?:\/\/[^\s<>"{}|\\^`\[\]]+)/g;
  const parts=[];let last=0;let match;
  while((match=re.exec(text))!==null){
    if(match.index>last)parts.push({type:"text",val:text.slice(last,match.index)});
    parts.push({type:"link",val:match[0]});
    last=match.index+match[0].length;
  }
  if(last<text.length)parts.push({type:"text",val:text.slice(last)});
  return parts;
}
function LinkChip({url,isMe}){
  const[imgErr,setImgErr]=useState(false);
  let host="";try{host=new URL(url).hostname;}catch(e){}
  const name=getSiteName(url);
  function handleClick(e){e.preventDefault();e.stopPropagation();window.open(url,"_blank","noopener,noreferrer");}
  return<span onClick={handleClick} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 10px 3px 6px",borderRadius:20,background:isMe?"rgba(255,255,255,0.2)":"#eef2ff",border:isMe?"1px solid rgba(255,255,255,0.4)":"1px solid #c3d2f0",color:isMe?"#fff":"#4a6ec5",fontSize:12,fontWeight:600,verticalAlign:"middle",maxWidth:200,cursor:"pointer",userSelect:"none",flexShrink:0}} title={url}>
    {imgErr?<span style={{fontSize:12,flexShrink:0}}>🔗</span>:<img src={`https://www.google.com/s2/favicons?domain=${host}&sz=16`} onError={()=>setImgErr(true)} style={{width:14,height:14,borderRadius:2,flexShrink:0}} alt=""/>}
    <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textDecoration:"underline",textUnderlineOffset:2}}>{name}</span>
  </span>;
}
function MessageText({text,isMe}){
  const parts=parseLinks(text);
  if(parts.length===1&&parts[0].type==="text")return<span>{text}</span>;
  return<span>{parts.map((p,i)=>p.type==="link"?<LinkChip key={i} url={p.val} isMe={isMe}/>:<span key={i}>{p.val}</span>)}</span>;
}

function TimeoutBar({until}){
  const[rem,setRem]=useState(Math.max(0,until-Date.now()));
  useEffect(()=>{if(until<=Date.now()){setRem(0);return;}const t=setInterval(()=>{const r=Math.max(0,until-Date.now());setRem(r);if(r===0)clearInterval(t);},1000);return()=>clearInterval(t);},[until]);
  if(rem<=0)return null;
  return<div style={{background:"#fff5f5",border:"1px solid #feb2b2",borderRadius:10,padding:"10px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:600,color:"#c53030"}}>You are timed out. You may send messages again in <strong>{fmtCountdown(rem)}</strong>.</div>;
}

function CooldownBar({until}){
  const[rem,setRem]=useState(Math.max(0,until-Date.now()));
  useEffect(()=>{if(until<=Date.now()){setRem(0);return;}const t=setInterval(()=>{const r=Math.max(0,until-Date.now());setRem(r);if(r===0)clearInterval(t);},100);return()=>clearInterval(t);},[until]);
  if(rem<=0)return null;
  const pct=Math.round((rem/5000)*100);
  return<div style={{background:"#f0f4ff",border:"1px solid #c3d2f0",borderRadius:10,padding:"8px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:10,fontSize:12,fontWeight:600,color:"#4a6ec5"}}>
    <span>⏳ Cooldown:</span>
    <div style={{flex:1,background:"#dce8ff",borderRadius:20,height:6,overflow:"hidden"}}>
      <div style={{width:`${pct}%`,height:"100%",background:"#4a6ec5",borderRadius:20,transition:"width 0.1s linear"}}/>
    </div>
    <span style={{minWidth:28,textAlign:"right"}}>{(rem/1000).toFixed(1)}s</span>
  </div>;
}

function SuccessMsg({children}){return<div style={{textAlign:"center",padding:"22px 16px",color:"#276749",fontWeight:700,fontSize:15,background:"#f0fff4",borderRadius:12,border:"1px solid #9ae6b4"}}>✅ {children}</div>;}

function Captcha1({stepFails,onPass,onFail,completed}){
  const canvasRef=useRef();
  const[answer,setAnswer]=useState("");
  const[target,setTarget]=useState("");
  const CHARS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function gen(){return Array.from({length:5},()=>CHARS[Math.floor(Math.random()*CHARS.length)]).join("");}
  function draw(text,canvas){
    const ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;
    ctx.clearRect(0,0,w,h);ctx.fillStyle="#eef1ff";ctx.fillRect(0,0,w,h);
    for(let i=0;i<10;i++){ctx.beginPath();ctx.strokeStyle=`hsl(${Math.random()*360},55%,72%)`;ctx.lineWidth=1.5;ctx.moveTo(Math.random()*w,Math.random()*h);ctx.bezierCurveTo(Math.random()*w,Math.random()*h,Math.random()*w,Math.random()*h,Math.random()*w,Math.random()*h);ctx.stroke();}
    for(let i=0;i<55;i++){ctx.fillStyle=`rgba(${Math.random()*180|0},${Math.random()*180|0},${Math.random()*180|0},0.3)`;ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,Math.random()*2,0,Math.PI*2);ctx.fill();}
    const cols=["#1a1a2e","#302b63","#b87d1a","#3a5ec4","#1a6040"];
    const sp=w/(text.length+1);
    text.split("").forEach((c,i)=>{ctx.save();ctx.font=`bold ${28+Math.random()*9|0}px Arial`;ctx.fillStyle=cols[i%cols.length];const x=sp*(i+1)+(Math.random()-.5)*9,y=h/2+(Math.random()-.5)*15;ctx.translate(x,y);ctx.rotate((Math.random()-.5)*.5);ctx.fillText(c,0,0);ctx.restore();});
  }
  useEffect(()=>{const t=gen();setTarget(t);setAnswer("");setTimeout(()=>{if(canvasRef.current)draw(t,canvasRef.current);},30);},[stepFails]);
  function check(){if(answer.toUpperCase()===target)onPass();else onFail();}
  if(completed)return<SuccessMsg>Letters verified! Nice eye. 👁️</SuccessMsg>;
  return<div>
    <h3 style={{margin:"0 0 6px",fontSize:16,fontWeight:700,color:"#1a1a2e"}}>Type the characters you see</h3>
    <p style={{margin:"0 0 14px",fontSize:13,color:"#888"}}>Identify the 5 distorted characters in the image below.</p>
    <canvas ref={canvasRef} width={320} height={84} style={{display:"block",margin:"0 auto 14px",borderRadius:10,border:"2px solid #e8e8e8",maxWidth:"100%"}}/>
    <input value={answer} onChange={e=>setAnswer(e.target.value.toUpperCase())} onKeyDown={e=>e.key==="Enter"&&check()} placeholder="Enter characters..." maxLength={5} style={{width:"100%",padding:"11px 16px",border:"2px solid #e8e8e8",borderRadius:10,fontSize:20,letterSpacing:8,textAlign:"center",outline:"none",marginBottom:10,fontWeight:700,background:"#fafafa",boxSizing:"border-box"}}/>
    <button onClick={check} style={{width:"100%",padding:"11px",background:"linear-gradient(135deg,#1a1a2e,#302b63)",color:"#e8b84b",border:"none",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer"}}>Check</button>
  </div>;
}

function Captcha2({stepFails,onPass,onFail,completed}){
  const G=4,C=4;
  const[phase,setPhase]=useState("show");
  const[pattern,setPattern]=useState([]);
  const[sel,setSel]=useState([]);
  const timerRef=useRef();
  function genPat(){const p=[];while(p.length<C){const c=Math.floor(Math.random()*G*G);if(!p.includes(c))p.push(c);}return p;}
  useEffect(()=>{clearTimeout(timerRef.current);const p=genPat();setPattern(p);setPhase("show");setSel([]);timerRef.current=setTimeout(()=>setPhase("input"),2800);return()=>clearTimeout(timerRef.current);},[stepFails]);
  function toggle(i){if(phase!=="input")return;setSel(prev=>prev.includes(i)?prev.filter(x=>x!==i):[...prev,i]);}
  function check(){const ok=pattern.every(c=>sel.includes(c))&&sel.every(c=>pattern.includes(c));if(ok)onPass();else onFail();}
  if(completed)return<SuccessMsg>Pattern memorized! Great memory. 🧠</SuccessMsg>;
  return<div>
    <h3 style={{margin:"0 0 6px",fontSize:16,fontWeight:700,color:"#1a1a2e"}}>Memorize the pattern</h3>
    <p style={{margin:"0 0 14px",fontSize:13,color:"#888"}}>{phase==="show"?"Remember the highlighted cells — they disappear soon!":"Now click the cells you saw to recreate the pattern."}</p>
    <div style={{display:"grid",gridTemplateColumns:`repeat(${G},1fr)`,gap:7,maxWidth:230,margin:"0 auto 16px"}}>
      {Array.from({length:G*G},(_,i)=>{const inP=pattern.includes(i),inS=sel.includes(i);return<div key={i} onClick={()=>toggle(i)} style={{height:48,borderRadius:8,cursor:phase==="input"?"pointer":"default",background:phase==="show"?(inP?"#e8b84b":"#f0f0f0"):(inS?"#e8b84b":"#f0f0f0"),border:`2px solid ${phase==="show"?(inP?"#c9972a":"#dedede"):(inS?"#c9972a":"#dedede")}`,transition:"all 0.2s",boxShadow:inP&&phase==="show"?"0 2px 8px rgba(232,184,75,0.4)":"none"}}/>;})}</div>
    {phase==="input"?<button onClick={check} style={{width:"100%",padding:"11px",background:"linear-gradient(135deg,#1a1a2e,#302b63)",color:"#e8b84b",border:"none",borderRadius:10,fontSize:14,fontWeight:700,cursor:"pointer"}}>Check Pattern</button>:<div style={{textAlign:"center",fontSize:13,color:"#aaa",fontStyle:"italic",padding:"6px 0"}}>⏳ Memorize carefully...</div>}
  </div>;
}

function CaptchaFlow({onComplete}){
  const[step,setStep]=useState(0);
  const[stepFails,setStepFails]=useState(0);
  const[completed,setCompleted]=useState([false,false,false,false,false]);
  const attemptsLeft=3-stepFails;
  const TITLES=["CAPTCHA 1 of 5 — Letter Recognition","CAPTCHA 2 of 5 — Pattern Memory","CAPTCHA 3 of 5 — Where's Alpha?","CAPTCHA 4 of 5 — Bird Identification","CAPTCHA 5 of 5 — Alpha Commitment"];
  function handlePass(){setCompleted(prev=>{const n=[...prev];n[step]=true;return n;});setStepFails(0);}
  function handleFail(){
    const nf=stepFails+1;
    if(nf>=3&&step>0){
      setCompleted(prev=>{const n=[...prev];n[step]=false;n[step-1]=false;return n;});
      setStep(s=>s-1);setStepFails(0);
    }else{
      setStepFails(nf);
    }
  }
  function proceed(){if(step<4){setStep(s=>s+1);setStepFails(0);}}
  const done=completed[step];
  return<div style={{position:"fixed",inset:0,background:"rgba(8,8,24,0.93)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:"16px"}}>
    <div style={{background:"#fff",borderRadius:22,padding:"28px 26px",width:"100%",maxWidth:490,boxShadow:"0 32px 100px rgba(0,0,0,0.7)",maxHeight:"92vh",overflowY:"auto"}}>
      <div style={{textAlign:"center",marginBottom:22}}>

          <span style={{fontSize:15}}>🔒</span>
          <span style={{color:"#e8b84b",fontFamily:"'Neuropolitical',sans-serif",fontSize:13,fontWeight:800,letterSpacing:1.5}}>ALPHA VERIFY</span>
        </div>
        <div style={{fontSize:11,fontWeight:700,color:"#999",textTransform:"uppercase",letterSpacing:0.8,marginBottom:12}}>{TITLES[step]}</div>
        <div style={{display:"flex",gap:5,justifyContent:"center",marginBottom:stepFails>0&&!done?8:0}}>
          {[0,1,2,3,4].map(i=><div key={i} style={{width:38,height:5,borderRadius:3,background:i<step?"#4ade80":i===step?"#e8b84b":"#e0e0e0",transition:"background 0.35s"}}/>)}
        </div>
        {stepFails>0&&!done&&<div style={{fontSize:12,color:"#e53e3e",fontWeight:600,marginTop:8}}>⚠️ {attemptsLeft} attempt{attemptsLeft!==1?"s":""} left — 3 failures sends you back!</div>}
      </div>
      {step===0&&<Captcha1 stepFails={stepFails} onPass={handlePass} onFail={handleFail} completed={done}/>}
      {step===1&&<Captcha2 stepFails={stepFails} onPass={handlePass} onFail={handleFail} completed={done}/>}
      {step===2&&<Captcha3 stepFails={stepFails} onPass={handlePass} onFail={handleFail} completed={done}/>}
      {step===3&&<Captcha4 stepFails={stepFails} onPass={handlePass} onFail={handleFail} completed={done}/>}
      {step===4&&<Captcha5 stepFails={stepFails} onPass={handlePass} onFail={handleFail} completed={done}/>}
      {done&&<div style={{marginTop:20,display:"flex",justifyContent:"flex-end"}}>
        {step<4
          ?<button onClick={proceed} style={{padding:"12px 30px",background:"linear-gradient(135deg,#1a1a2e,#302b63)",color:"#e8b84b",border:"none",borderRadius:12,fontSize:15,fontWeight:800,cursor:"pointer",letterSpacing:0.3,boxShadow:"0 4px 16px rgba(26,26,46,0.3)"}}>Proceed →</button>
          :<button onClick={onComplete} style={{padding:"12px 30px",background:"linear-gradient(135deg,#1a6040,#4ade80)",color:"#fff",border:"none",borderRadius:12,fontSize:15,fontWeight:800,cursor:"pointer",letterSpacing:0.3,boxShadow:"0 4px 16px rgba(74,222,128,0.35)"}}>☑️ Verify</button>
        }
      </div>}
    </div>
  </div>;
}


// ── WebRTC real-audio call hook ───────────────────────────────────────────────
// Firebase signaling layout (NOT under kv/ — written directly):

// SDP and ICE live under separate sub-trees so ICE pushes can never race
// with / overwrite the offer or answer written by .set().
function useWebRTCCall(myCallId, activeCalls, userEmail) {
  const [micStream, setMicStream] = useState(null);
  const [micError, setMicError]   = useState(null);
  const [rtcLogs, setRtcLogs]     = useState([]);   // on-screen debug lines

function App(){
  const[page,setPage]=useState("login");const[user,setUser]=useState(null);const[pendingUser,setPendingUser]=useState(null);const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const[form,setForm]=useState({name:"",email:"",password:"",location:""});
  const[room,setRoom]=useState(null);const[msgs,setMsgs]=useState([]);const[roomUsers,setRoomUsers]=useState([]);const[channels,setChannels]=useState([]);const[friendChannels,setFriendChannels]=useState([]);const[msgInput,setMsgInput]=useState("");const[timeoutUntil,setTimeoutUntil]=useState(0);const[cooldownUntil,setCooldownUntil]=useState(0);const[notifs,setNotifs]=useState([]);const[announcement,setAnnouncement]=useState(null);const[dismissedWarnings,setDismissedWarnings]=useState(new Set());const[bannedWords,setBannedWords]=useState([...DEFAULT_BANNED_WORDS]);
  const[activeCalls,setActiveCalls]=useState([]);const[myCallId,setMyCallId]=useState(null);
  const bottomRef=useRef();const pollMsgRef=useRef();const pollUsrRef=useRef();const pollChRef=useRef();const pollNotifRef=useRef();const pollAnnRef=useRef();const pollCallRef=useRef();const pollFchRef=useRef();const pendingRef=useRef([]);const roomRef=useRef(null);
  const fv=(k,v)=>setForm(f=>({...f,[k]:v}));

  async function doSignup(){
    setErr("");setLoading(true);
    try{let{name,email,password,location}=form;email=email.trim().toLowerCase();if(!name||!email||!password||!location){setErr("All fields are required.");setLoading(false);return;}
    if(await load("u_"+safe(email))){setErr("This email is already registered.");setLoading(false);return;}
    await save("auth_"+safe(email),JSON.stringify({hash:await sha256(password)}));
    const emailsR=await load("all_emails");const emails=emailsR?JSON.parse(emailsR.value):[];
    if(!emails.includes(email)){emails.push(email);await save("all_emails",JSON.stringify(emails));}
    const ud={name,email,location,role:null,timeoutUntil:0,lvl1SwearCount:0};
    await save("u_"+safe(email),JSON.stringify(ud));await getVC(email);setUser(ud);setLoading(false);setPage("roleSelect");
    }catch(e){console.error("Signup error:",e);setErr("Error: "+(e?.message||"Permission denied. Make sure your Firebase Realtime Database rules allow read/write."));setLoading(false);}
  }

  async function doForgotPassword(email,newPassword){
    const hash=await sha256(newPassword);
    await save("auth_"+safe(email),JSON.stringify({hash}));
  }

  async function doLogin(){
    setErr("");setLoading(true);
    try{let{email,password}=form;email=email.trim().toLowerCase();if(!email||!password){setErr("Email and password required.");setLoading(false);return;}
    const authR=await load("auth_"+safe(email));if(!authR){setErr("No account found with this email. Please check your email or create an account.");setLoading(false);return;}
    const auth=JSON.parse(authR.value);if(await sha256(password)!==auth.hash){setErr("Incorrect password.");setLoading(false);return;}
    const udR=await load("u_"+safe(email));if(!udR){setErr("Account data not found. Please try again.");setLoading(false);return;}
    const ud=JSON.parse(udR.value);if(await getLocked(email)){setErr("Your account has been locked by the site owner.");setLoading(false);return;}setUser(ud);setTimeoutUntil(ud.timeoutUntil||0);setLoading(false);
    if(!ud.role)setPage("roleSelect");else if(ud.role==="parent"&&!ud.children)setPage("childrenSelect");else enterChat(ud,true);
    }catch(e){console.error("Login error:",e);setErr("Error: "+(e?.message||"Could not connect to database. Check your Firebase rules allow read/write."));setLoading(false);}
  }

  async function chooseRole(role){const ud={...user,role};await save("u_"+safe(user.email),JSON.stringify(ud));setUser(ud);if(role==="student")setPage("gradeSelect");else if(role==="parent")setPage("childrenSelect");else enterChat(ud);}
  async function chooseGrade(grade){const ud={...user,grade};await save("u_"+safe(user.email),JSON.stringify(ud));setUser(ud);enterChat(ud);}
  async function chooseChildren(childEmails){const ud={...user,children:childEmails};await save("u_"+safe(user.email),JSON.stringify(ud));setUser(ud);enterChat(ud);}

  async function enterChat(u,fromLogin=false){
    if(u.email===OWNER_EMAIL){setPendingUser(u);setPage("ownerCaptcha");return;}
    if(fromLogin&&u.skipLoginCaptcha){await completeCaptcha(u);}
    else{setPendingUser(u);setPage("captcha");}
  }
  async function completeCaptcha(u){
    const r={type:"loc",id:"loc_"+safe(u.location),name:`${u.location} — General`};roomRef.current=r;setRoom(r);
    await loadPeers(u);await loadChannels(u.location);if(u.role==="student")await loadFriendChannels(u);setAnnouncement(await getAnnouncement(u.location));
    const dismissedR=await load("dismissed_"+safe(u.email));const dismissed=dismissedR?JSON.parse(dismissedR.value):[];setDismissedWarnings(new Set(dismissed));
    setBannedWords(await loadBannedWords(u.location));
    setPage("chat");
  }

  async function loadPeers(u){
    const r=await load("all_emails");const emails=r?JSON.parse(r.value):[];const list=[];
    for(const e of emails){if(e===u.email)continue;const ur=await load("u_"+safe(e));if(ur){const ud=JSON.parse(ur.value);if(ud&&ud.location===u.location&&ud.role){const locked=await getLocked(e);list.push({...ud,locked});}}}
    setRoomUsers(list);
  }
  async function loadChannels(loc){const r=await load("chs_"+safe(loc));setChannels(r?JSON.parse(r.value):[]);}
  async function loadFriendChannels(u){
    const idxR=await load("fch_idx_"+safe(u.email));
    const ids=idxR?JSON.parse(idxR.value):[];
    const list=[];
    for(const id of ids){const dr=await load("fch_data_"+id);if(dr)list.push(JSON.parse(dr.value));}
    setFriendChannels(list);
  }
  async function createFriendChannel(name,memberEmails){
    const id="fch"+Date.now();
    const ch={id,name,owner:user.email,members:[user.email,...memberEmails],location:user.location,createdAt:Date.now()};
    await save("fch_data_"+id,JSON.stringify(ch));
    for(const em of ch.members){
      const idxR=await load("fch_idx_"+safe(em));const ids=idxR?JSON.parse(idxR.value):[];
      await save("fch_idx_"+safe(em),JSON.stringify([...new Set([...ids,id])]));
    }
    setFriendChannels(prev=>[...prev,ch]);
    const r={type:"fch",id:"fch_"+id,name:ch.name,chData:ch};roomRef.current=r;setRoom(r);
  }
  async function deleteFriendChannel(ch){
    // Only owner can delete
    for(const em of ch.members){
      const idxR=await load("fch_idx_"+safe(em));const ids=idxR?JSON.parse(idxR.value):[];
      await save("fch_idx_"+safe(em),JSON.stringify(ids.filter(i=>i!==ch.id)));
    }
    await save("fch_data_"+ch.id,null);
    setFriendChannels(prev=>prev.filter(f=>f.id!==ch.id));
    if(room?.id==="fch_"+ch.id){const r={type:"loc",id:"loc_"+safe(user.location),name:`${user.location} — General`};roomRef.current=r;setRoom(r);}
  }
  async function leaveFriendChannel(ch){
    const idxR=await load("fch_idx_"+safe(user.email));const ids=idxR?JSON.parse(idxR.value):[];
    await save("fch_idx_"+safe(user.email),JSON.stringify(ids.filter(i=>i!==ch.id)));
    const updated={...ch,members:ch.members.filter(e=>e!==user.email)};
    await save("fch_data_"+ch.id,JSON.stringify(updated));
    setFriendChannels(prev=>prev.filter(f=>f.id!==ch.id));
    if(room?.id==="fch_"+ch.id){const r={type:"loc",id:"loc_"+safe(user.location),name:`${user.location} — General`};roomRef.current=r;setRoom(r);}
  }

  async function createChannel(name,minGrade){
    const loc=user.location;const chsR=await load("chs_"+safe(loc));const chs=chsR?JSON.parse(chsR.value):[];
    const ch={id:"ch"+Date.now(),name,location:loc,minGrade};chs.push(ch);await save("chs_"+safe(loc),JSON.stringify(chs));setChannels([...chs]);
    const r={type:"ch",id:"ch_"+ch.id,name:ch.name,minGrade};roomRef.current=r;setRoom(r);
  }
  async function deleteChannel(ch){
    const loc=user.location;const chsR=await load("chs_"+safe(loc));const chs=chsR?JSON.parse(chsR.value):[];const updated=chs.filter(c=>c.id!==ch.id);
    await save("chs_"+safe(loc),JSON.stringify(updated));setChannels(updated);
    if(room?.id==="ch_"+ch.id){const r={type:"loc",id:"loc_"+safe(loc),name:`${loc} — General`};roomRef.current=r;setRoom(r);}
  }

  useEffect(()=>{
    if(page!=="chat"||!room)return;clearInterval(pollMsgRef.current);pendingRef.current=[];
    const roomId=room.id;
    const poll=async()=>{const polled=await getMsgs(roomId);pendingRef.current=pendingRef.current.filter(p=>!polled.find(m=>m.id===p.id));setMsgs([...polled,...pendingRef.current].sort((a,b)=>a.ts-b.ts));};
    poll();pollMsgRef.current=setInterval(poll,2000);return()=>clearInterval(pollMsgRef.current);
  },[page,room?.id]);

  useEffect(()=>{
    if(page!=="chat"||!user)return;
    pollUsrRef.current=setInterval(()=>loadPeers(user),8000);pollChRef.current=setInterval(()=>loadChannels(user.location),5000);if(user.role==="student")pollFchRef.current=setInterval(()=>loadFriendChannels(user),7000);
    pollAnnRef.current=setInterval(async()=>{setAnnouncement(await getAnnouncement(user.location));setBannedWords(await loadBannedWords(user.location));},5000);
    return()=>{clearInterval(pollUsrRef.current);clearInterval(pollChRef.current);clearInterval(pollAnnRef.current);};
  },[page,user?.email]);

  useEffect(()=>{if(page!=="chat"||!user)return;const poll=async()=>setNotifs(await loadNotifs(user.email));poll();pollNotifRef.current=setInterval(poll,4000);return()=>clearInterval(pollNotifRef.current);},[page,user?.email]);
  useEffect(()=>{if(page!=="chat"||!user)return;const poll=async()=>{const calls=await loadCalls(user.location);setActiveCalls(calls);};poll();pollCallRef.current=setInterval(poll,3000);return()=>clearInterval(pollCallRef.current);},[page,user?.email]);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);

  async function sendMsg(){
    if(!msgInput.trim()||!room)return;if(msgInput.length>MSG_CHAR_LIMIT)return;if(timeoutUntil&&timeoutUntil>Date.now())return;
    if(user.role==="student"&&cooldownUntil&&cooldownUntil>Date.now())return;
    if(user.role==="student"&&room?.type==="ch"&&room?.minGrade&&gradeRank(user.grade)<gradeRank(room.minGrade))return;
    if(user.shadowMode&&room?.type==="ch"){const _spR=await load("shadow_perm_"+safe(room.id)+"_"+safe(user.email));if(!_spR)return;}
    if(room?.type==="fch"){const _chData=room.chData||JSON.parse((await load("fch_data_"+room.id.replace("fch_",""))||{value:"{}"}).value);if(!_chData?.members?.includes(user.email))return;}
    if(room?.type==="dm"&&room.targetEmail){if(await getLocked(room.targetEmail))return;}
    const text=msgInput.trim();const roomId=room.id;const email=user.email;const name=user.name;const role=user.role;setMsgInput("");
    if(role==="student")setCooldownUntil(Date.now()+5000);
    if(role==="student"){const sw=checkSwear(text);if(sw){let timeoutMins=sw.minutes;let lvl1Count=user.lvl1SwearCount||0;if(sw.level===1){lvl1Count+=1;if(lvl1Count>=3){timeoutMins=5;lvl1Count=0;}}const sentinel={id:Date.now()+"_"+Math.random().toString(36).slice(2,7),from:email,name,role,ts:Date.now(),deleted:true,swearLevel:sw.level,swearLabel:sw.label,swearWord:sw.word,timeoutMins,text:""};pendingRef.current.push(sentinel);setMsgs(prev=>[...prev,sentinel]);await appendMsg(roomId,sentinel);const guides=await getGuidesAtCampus(user.location);const pun=timeoutMins>0?` They have been timed out for ${timeoutMins} minute${timeoutMins>1?"s":""}.`:"";await Promise.all(guides.map(g=>writeNotif(g.email,`⚠️ ${name} used a ${sw.label} swear word: "${sw.word}".${pun}`)));const swParents=await getParentsOfStudent(email,user.location);await Promise.all(swParents.map(p=>writeNotif(p.email,`⚠️ Your child ${name} used a ${sw.label} swear word: "${sw.word}".${pun}`)));const until=timeoutMins>0?Date.now()+timeoutMins*60*1000:(user.timeoutUntil||0);const ud={...user,lvl1SwearCount:lvl1Count,timeoutUntil:until};setUser(ud);await save("u_"+safe(email),JSON.stringify(ud));if(timeoutMins>0)setTimeoutUntil(until);return;}}
    const brainrotWord=role==="student"?checkBrainrot(text,bannedWords):null;
    const msg={id:Date.now()+"_"+Math.random().toString(36).slice(2,7),from:email,name,role,text,ts:Date.now(),flagged:false,brainrot:brainrotWord||null,likedBy:[],grade:user.grade||null,avatar:user.avatar||null};
    pendingRef.current.push(msg);setMsgs(prev=>[...prev,msg]);await appendMsg(roomId,msg);
    if(brainrotWord){const guides=await getGuidesAtCampus(user.location);await Promise.all(guides.map(g=>writeNotif(g.email,`⚠️ ${name} used a banned brainrot word: "${brainrotWord}".`)));const brParents=await getParentsOfStudent(email,user.location);await Promise.all(brParents.map(p=>writeNotif(p.email,`⚠️ Your child ${name} used a banned brainrot word: "${brainrotWord}".`)));}
  }

  async function handleLike(m){if(!room||m.deleted)return;const likedBy=m.likedBy||[];const newLikedBy=likedBy.includes(user.email)?likedBy.filter(e=>e!==user.email):[...likedBy,user.email];await updateMsg(room.id,m.id,{likedBy:newLikedBy});setMsgs(prev=>prev.map(x=>x.id===m.id?{...x,likedBy:newLikedBy}:x));}
  async function handleReport(m,reason,summary){const rpt={id:Date.now()+"_r",msgId:m.id,author:m.name,reporter:user.name,reason:reason.label,summary,ts:Date.now()};const key="rpts_"+safe(user.location);const rR=await load(key);const arr=rR?JSON.parse(rR.value):[];arr.unshift(rpt);await save(key,JSON.stringify(arr));const guides=await getGuidesAtCampus(user.location);await Promise.all(guides.map(g=>writeNotif(g.email,`🚩 ${user.name} reported a message by ${m.name} for ${reason.label}. Summary: "${summary.slice(0,80)}${summary.length>80?"...":""}"`)));const rptParents=await getParentsOfStudent(m.from,user.location);await Promise.all(rptParents.map(p=>writeNotif(p.email,`🚩 Your child ${m.name} was reported for ${reason.label}. Summary: "${summary.slice(0,80)}${summary.length>80?"...":""}"`)));}
  async function handleDeleteOwn(m){if(!room||m.from!==user.email)return;await deleteMsg(room.id,m.id);setMsgs(prev=>prev.filter(x=>x.id!==m.id));pendingRef.current=pendingRef.current.filter(x=>x.id!==m.id);}
  async function handleDeleteGuide(m){if(!room)return;await deleteMsg(room.id,m.id);setMsgs(prev=>prev.filter(x=>x.id!==m.id));}
  async function notifyUser(target){if(await getLocked(target.email))return;await writeNotif(target.email,`💬 ${user.name} would like to chat with you.`);}
  async function handleMarkRead(){await markAllRead(user.email);setNotifs(prev=>prev.map(n=>({...n,read:true})));}
  function openDM(target){const key=[user.email,target.email].sort().map(safe).join("_dm_");const r={type:"dm",id:"dm_"+key,name:target.name,targetEmail:target.email};roomRef.current=r;setRoom(r);}
  async function handleAdjustKairos(email,newPoints){await setKairos(email,newPoints);}
  async function handleBanWord(word){const updated=[...bannedWords,word];await saveBannedWords(user.location,updated);setBannedWords(updated);}
  async function handleUnbanWord(word){const updated=bannedWords.filter(w=>w.toLowerCase()!==word.toLowerCase());await saveBannedWords(user.location,updated);setBannedWords(updated);}
  async function handleAnnounce(text,topic){const data={text,topicLabel:topic.label,authorName:user.name,ts:Date.now()};await saveAnnouncement(user.location,data);setAnnouncement(data);}
  async function handleClearAnnouncement(){await clearAnnouncement(user.location);setAnnouncement(null);}
  async function saveSettings(name,location,grade,avatar,children,skipLoginCaptcha,shadowMode,shadowAvatar,autismMode){const ud={...user,name,location,skipLoginCaptcha:!!skipLoginCaptcha,autismMode:!!autismMode};if(grade)ud.grade=grade;if(avatar)ud.avatar=avatar;if(user.role==="parent")ud.children=children||[];if(user.role==="student"){ud.shadowMode=!!shadowMode;ud.shadowAvatar=shadowAvatar||"🌚";}await save("u_"+safe(user.email),JSON.stringify(ud));setUser(ud);}
  async function deleteAccount(){const email=user.email;await save("u_"+safe(email),null);await save("auth_"+safe(email),null);const emailsR=await load("all_emails");const emails=emailsR?JSON.parse(emailsR.value):[];await save("all_emails",JSON.stringify(emails.filter(e=>e!==email)));signOut();}
  async function dismissWarning(id){const key="dismissed_"+safe(user.email);const existing=(await load(key))?JSON.parse((await load(key)).value):[];if(!existing.includes(id)){existing.push(id);await save(key,JSON.stringify(existing));}setDismissedWarnings(prev=>new Set([...prev,id]));}
  async function handleStartCall(callName){
    if(myCallId)return;
    const call=await startCall(user.location,callName,user);
    setMyCallId(call.id);
    const calls=await loadCalls(user.location);setActiveCalls(calls);
  }
  async function handleJoinCall(call){
    if(myCallId&&myCallId!==call.id){return;}
    if(myCallId===call.id)return;
    const updated=await joinCall(user.location,call.id,user);
    if(updated){setMyCallId(call.id);const calls=await loadCalls(user.location);setActiveCalls(calls);}
  }
  async function handleLeaveCall(){
    if(!myCallId)return;
    await leaveCall(user.location,myCallId,user.email);
    setMyCallId(null);
    const calls=await loadCalls(user.location);setActiveCalls(calls);
  }
  function signOut(){clearInterval(pollMsgRef.current);clearInterval(pollUsrRef.current);clearInterval(pollChRef.current);clearInterval(pollNotifRef.current);clearInterval(pollAnnRef.current);clearInterval(pollCallRef.current);clearInterval(pollFchRef.current);pendingRef.current=[];roomRef.current=null;setUser(null);setRoom(null);setMsgs([]);setRoomUsers([]);setChannels([]);setFriendChannels([]);setTimeoutUntil(0);setNotifs([]);setAnnouncement(null);setDismissedWarnings(new Set());setActiveCalls([]);setMyCallId(null);setForm({name:"",email:"",password:"",location:""});setPage("login");}

  if(page==="ownerCaptcha")return<OwnerCaptchaScreen pendingUser={pendingUser} onSuccess={()=>completeCaptcha(pendingUser)} onBack={()=>setPage("login")}/>;
  if(page==="login")return<LoginScreen form={form} fv={fv} onLogin={doLogin} onSignup={()=>{setErr("");setPage("signup");}} onForgotPassword={doForgotPassword} onSocialLogin={async ud=>{setUser(ud);setTimeoutUntil(ud.timeoutUntil||0);if(!ud.role)setPage("roleSelect");else if(ud.role==="parent"&&!ud.children)setPage("childrenSelect");else enterChat(ud,true);}} err={err} loading={loading}/>;
  if(page==="signup")return<SignupScreen form={form} fv={fv} onSubmit={doSignup} onBack={()=>{setErr("");setPage("login");}} err={err} loading={loading}/>;
  if(page==="roleSelect")return<RoleScreen name={user?.name} onSelect={chooseRole}/>;
  if(page==="gradeSelect")return<GradeScreen name={user?.name} onSelect={chooseGrade}/>;
  if(page==="childrenSelect")return<ChildrenScreen user={user} onProceed={chooseChildren}/>;
  if(page==="captcha")return<CaptchaFlow onComplete={()=>completeCaptcha(pendingUser)}/>;
  return<ChatScreen user={user} room={room} msgs={msgs} roomUsers={roomUsers} channels={channels} msgInput={msgInput} setMsgInput={setMsgInput} onSend={sendMsg} onDM={openDM} onBotRoom={bot=>{const r={type:"bot",botId:bot.id,id:"bot_"+bot.id,name:bot.name};roomRef.current=r;setRoom(r);}} onLocRoom={()=>{const r={type:"loc",id:"loc_"+safe(user.location),name:`${user.location} — General`};roomRef.current=r;setRoom(r);}} onChannel={ch=>{const r={type:"ch",id:"ch_"+ch.id,name:ch.name,minGrade:ch.minGrade||null};roomRef.current=r;setRoom(r);}} onFriendChannel={ch=>{const r={type:"fch",id:"fch_"+ch.id,name:ch.name,chData:ch};roomRef.current=r;setRoom(r);}} onCreateChannel={createChannel} onDeleteChannel={deleteChannel} friendChannels={friendChannels} onCreateFriendChannel={createFriendChannel} onDeleteFriendChannel={deleteFriendChannel} onLeaveFriendChannel={leaveFriendChannel} onDelete={handleDeleteGuide} bottomRef={bottomRef} onSignOut={signOut} isGuide={user?.role==="guide"} isParent={user?.role==="parent"} timeoutUntil={timeoutUntil} cooldownUntil={cooldownUntil} onSaveSettings={saveSettings} onDeleteAccount={deleteAccount} onNotifyUser={notifyUser} notifs={notifs} onMarkRead={handleMarkRead} onLike={handleLike} onReport={handleReport} onDeleteOwn={handleDeleteOwn} announcement={announcement} onAnnounce={handleAnnounce} onClearAnnouncement={handleClearAnnouncement} dismissedWarnings={dismissedWarnings} onDismissWarning={dismissWarning} bannedWords={bannedWords} onBanWord={handleBanWord} onUnbanWord={handleUnbanWord} onAdjustKairos={handleAdjustKairos} activeCalls={activeCalls} myCallId={myCallId} onStartCall={handleStartCall} onJoinCall={handleJoinCall} onLeaveCall={handleLeaveCall}/>;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
